spring.application.name=slotbooker

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/slotbooker
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# This property resolves the circular dependency issue.
spring.jpa.open-in-view=false

# A secure, random key for JWT signing. Must be at least 256 bits (32 bytes).
# You can generate a Base64-encoded string for this.
jwt.secret=${JWT_SECRET_KEY}
